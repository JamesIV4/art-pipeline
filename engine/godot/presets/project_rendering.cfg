; Origin: S:\Repos\trick-or-treat\game\project.godot ([rendering], [shader_globals]) and
;   S:\Repos\OpenXcom-Extended-3D\xcom-3d-godot\battlescape-dev\project.godot ([rendering]) (imported 2026-10-25)
; Changes: merged into one paste-in snippet for a game's project.godot. Uncommented lines = the trick-or-treat values
; (the art-pipeline default); ";XCOM" lines = the XCOM battlescape's differing values, for an orthographic / far camera.
; Paste the sections into project.godot (merge with existing [rendering] keys; Godot keeps only one of each key).
; The [shader_globals] block is REQUIRED by shaders/surface/toon.gdshader (it declares these three global uniforms
; and fails to compile without them). The game updates them every frame for the camera-to-player occluder cutout;
; leaving cutout_radius = 0 disables the cutout.

[rendering]

renderer/rendering_method="forward_plus"
; Directional shadows: 8192 atlas, soft filter Ultra (XCOM shipped the same: shadow_res 8192, shadow_filter 5).
lights_and_shadows/directional_shadow/size=8192
lights_and_shadows/directional_shadow/soft_shadow_filter_quality=5
; SSAO quality Ultra (4) at full resolution (half_size=false). post_fx.gd also forces Ultra/full-res at runtime.
environment/ssao/quality=4
environment/ssao/half_size=false
; MSAA 4x (value 2 = 4x). XCOM shipped 4x too (msaa 2; it was 8x before 2026-10-16). TAA / FXAA / SMAA: off in both.
anti_aliasing/quality/msaa_3d=2
; Night-blue clear colour (only seen where nothing draws, e.g. before the sky is up).
environment/defaults/default_clear_color=Color(0.04, 0.06, 0.15, 1)
;XCOM environment/defaults/default_clear_color=Color(0, 0, 0, 1)
;XCOM rendering_device/driver.windows="vulkan"          ; battlescape (LibGodot); the standalone viewer/labs use "d3d12"
;XCOM limits/global_shader_variables/buffer_size=524288  ; many per-tile globals
;XCOM limits/cluster_builder/max_clustered_elements=4096 ; many small lights (fires, flares, soldier lights)
;XCOM environment/ssao/fadeout_from=2000.0               ; the orthographic camera stands 250-359 m back:
;XCOM environment/ssao/fadeout_to=4000.0                 ; the default 50 / 300 m fade would kill SSAO / SSIL
;XCOM environment/ssil/fadeout_from=2000.0
;XCOM environment/ssil/fadeout_to=4000.0

[shader_globals]

cutout_from={
"type": "vec3",
"value": Vector3(0, 0, 0)
}
cutout_to={
"type": "vec3",
"value": Vector3(0, 0, 0)
}
cutout_radius={
"type": "float",
"value": 0.0
}

; XCOM main project (x-com--ufo-defense-3d) texture import defaults: lossless, mipmapped (compression is a separate
; pipeline step there, see the texture-compression technique):
;XCOM [importer_defaults]
;XCOM texture={ "compress/mode": 0, "detect_3d/compress_to": 0, "mipmaps/generate": true }
